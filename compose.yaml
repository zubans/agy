# Worker containers (codex-*, claude-*, gemini-*, agy-*) are declared dynamically in
# compose.workers.yaml (generated by `make init` / `make agent-add` via scripts/workers.sh)
# and merged automatically when COMPOSE_FILE=compose.yaml:compose.workers.yaml is in .env.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: cli-ai-gateway:local
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_CONFIG: /etc/cli-ai-gateway/config.yaml
      GATEWAY_LISTEN: "0.0.0.0:8080"
      GATEWAY_STORAGE_PATH: /var/lib/cli-gateway
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_ADMIN_TOKEN: "${GATEWAY_ADMIN_TOKEN:-}"
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_OLLAMA_BASE_URL: "${GATEWAY_OLLAMA_BASE_URL:-}"
      GATEWAY_OLLAMA_MODEL: "${GATEWAY_OLLAMA_MODEL:-}"
    volumes:
      - ./configs/config.docker.yaml:/etc/cli-ai-gateway/config.yaml:ro
      - gateway_data:/var/lib/cli-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cpus: "${GATEWAY_CPUS:-1.0}"
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gateway_data:
