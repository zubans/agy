x-worker-common: &worker-common
  restart: unless-stopped
  user: "10001:10001"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
  expose:
    - "9090"
  cpus: "1.0"
  mem_limit: 1g
  pids_limit: 128

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: cli-ai-gateway:local
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "${GATEWAY_BIND_HOST:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_CONFIG: /etc/cli-ai-gateway/config.yaml
      GATEWAY_LISTEN: "0.0.0.0:8080"
      GATEWAY_STORAGE_PATH: /var/lib/cli-gateway
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_ADMIN_TOKEN: "${GATEWAY_ADMIN_TOKEN:-}"
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_OLLAMA_BASE_URL: "${GATEWAY_OLLAMA_BASE_URL:-}"
      GATEWAY_OLLAMA_MODEL: "${GATEWAY_OLLAMA_MODEL:-}"
    volumes:
      - ./configs/config.docker.yaml:/etc/cli-ai-gateway/config.yaml:ro
      - gateway_data:/var/lib/cli-gateway
    depends_on:
      - codex
      - claude
      - gemini
      - agy-1
      - agy-2
      - agy-3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"

  codex:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-codex
    image: cli-ai-worker-codex:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - codex_home:/var/lib/cli-gateway/home

  claude:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-claude
    image: cli-ai-worker-claude:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - claude_home:/var/lib/cli-gateway/home

  gemini:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-gemini
    image: cli-ai-worker-gemini:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
      NO_BROWSER: "true"
    volumes:
      - gemini_home:/var/lib/cli-gateway/home

  agy-1:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-agy
    image: cli-ai-worker-agy:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - agy_1_home:/var/lib/cli-gateway/home

  agy-2:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-agy
    image: cli-ai-worker-agy:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - agy_2_home:/var/lib/cli-gateway/home

  agy-3:
    <<: *worker-common
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-agy
    image: cli-ai-worker-agy:local
    environment:
      GATEWAY_WORKER_TOKEN: "${GATEWAY_WORKER_TOKEN:-dev-worker-token-change-me}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
    volumes:
      - agy_3_home:/var/lib/cli-gateway/home

volumes:
  gateway_data:
  codex_home:
  claude_home:
  gemini_home:
  agy_1_home:
  agy_2_home:
  agy_3_home:
